<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0e1116">
<title>Rack</title>
<style>
  /* No webfonts on purpose: the prototype has to work in a basement gym
     with no signal (REQ-B7). */
  :root {
    --bg: #0e1116;
    --surface: #171b22;
    --surface-2: #1f242e;
    --ink: #f2f4f7;
    --muted: #99a2b2;
    --faint: #6b7484;
    --line: #262c38;
    --accent: #4d7cff;
    --accent-ink: #ffffff;
    --accent-soft: #17213d;
    --amber: #f5a524;
    --amber-soft: #2a2213;
    --alert: #ff6b6b;
    --alert-soft: #2d1618;
    --tap: 48px;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font);
    font-size: 17px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior-y: contain;
  }

  button { font-family: inherit; font-size: inherit; color: inherit; cursor: pointer; }

  /* Header */
  .topbar {
    position: sticky;
    top: 0;
    z-index: 20;
    background: rgba(14, 17, 22, 0.93);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
    padding: calc(12px + env(safe-area-inset-top)) 18px 12px;
  }

  .topbar-inner {
    max-width: 1120px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .wordmark { font-size: 20px; font-weight: 800; letter-spacing: -0.02em; }
  .wordmark span { color: var(--accent); }

  .context-chip {
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 7px 13px;
    font-size: 13px;
    color: var(--muted);
    min-height: 36px;
    display: flex;
    align-items: center;
    gap: 7px;
  }

  /* Shell: one column on phones, two panes on desktop */
  .shell {
    max-width: 1120px;
    margin: 0 auto;
    padding: 20px 18px calc(104px + env(safe-area-inset-bottom));
  }

  .pane-setup, .pane-session { min-width: 0; }

  body[data-view="setup"] .pane-session,
  body[data-view="session"] .pane-setup { display: none; }

  .desktop-only { display: none; }

  @media (min-width: 980px) {
    .shell {
      display: grid;
      grid-template-columns: 340px 1fr;
      gap: 34px;
      align-items: start;
      padding-bottom: 60px;
    }
    body[data-view="setup"] .pane-session,
    body[data-view="session"] .pane-setup { display: block; }
    .pane-setup {
      position: sticky;
      top: 84px;
      max-height: calc(100vh - 110px);
      overflow-y: auto;
      padding-right: 6px;
    }
    .bottom { display: none; }
    .desktop-only { display: block; }
    .context-chip { display: none; }
  }

  .step-label {
    font-size: 12px; font-weight: 700; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--accent); margin: 0 0 8px;
  }

  h1 { font-size: 27px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.15; margin: 0 0 6px; }
  .sub { color: var(--muted); font-size: 15px; margin: 0 0 22px; }

  h2 {
    font-size: 12.5px; font-weight: 700; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--faint); margin: 24px 0 10px;
  }

  h2:first-of-type { margin-top: 4px; }

  /* Chips */
  .chip-row { display: flex; flex-wrap: wrap; gap: 8px; }

  .chip {
    min-height: var(--tap);
    padding: 11px 15px;
    border-radius: 12px;
    border: 1.5px solid var(--line);
    background: var(--surface);
    color: var(--ink);
    font-size: 15px;
    font-weight: 600;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    transition: border-color .12s, background .12s;
  }

  .chip[aria-pressed="true"], .chip.on { border-color: var(--accent); background: var(--accent-soft); }
  .chip .tick { color: var(--accent); font-weight: 800; }
  .chip[aria-pressed="false"] .tick { visibility: hidden; }

  .chip.warn[aria-pressed="true"] { border-color: var(--alert); background: var(--alert-soft); }
  .chip.warn[aria-pressed="true"] .tick { color: var(--alert); }

  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .grid-2 .chip { justify-content: flex-start; }

  /* Stepper */
  .stepper {
    display: flex; align-items: center; gap: 12px;
    background: var(--surface);
    border: 1.5px solid var(--line);
    border-radius: 12px;
    padding: 9px 11px;
  }

  .stepper button {
    width: var(--tap); height: var(--tap);
    border-radius: 10px; border: none;
    background: var(--surface-2);
    font-size: 24px; font-weight: 700; line-height: 1;
  }

  .stepper button:active { background: var(--accent); color: var(--accent-ink); }

  .stepper .val {
    flex: 1; text-align: center; font-size: 20px; font-weight: 800;
    font-variant-numeric: tabular-nums;
  }

  .stepper .val small { display: block; font-size: 11.5px; font-weight: 500; color: var(--faint); letter-spacing: .05em; }

  /* Banners */
  .banner {
    border-radius: 12px; padding: 13px 15px;
    font-size: 14.5px; line-height: 1.5; margin-bottom: 12px;
  }

  .banner.time { background: var(--amber-soft); border: 1px solid rgba(245,165,36,.35); color: #f6d9a4; }
  .banner.time b { color: var(--amber); }
  .banner.safety { background: var(--alert-soft); border: 1px solid rgba(255,107,107,.4); color: #ffc9c9; }
  .banner.safety b { color: var(--alert); }
  .banner .disclaim { display: block; margin-top: 6px; color: var(--muted); font-size: 13px; }

  /* Exercise cards */
  .ex {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 15px 15px 13px;
    margin-bottom: 12px;
  }

  .ex.done { opacity: .55; }

  .ex-top { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
  .ex-name { font-size: 18px; font-weight: 700; letter-spacing: -0.01em; margin: 0; }
  .ex-meta { font-size: 13.5px; color: var(--muted); margin: 3px 0 0; font-variant-numeric: tabular-nums; }

  .pill {
    font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
    padding: 4px 8px; border-radius: 6px;
    background: var(--surface-2); color: var(--faint); white-space: nowrap;
  }

  .pill.main { background: var(--accent-soft); color: var(--accent); }

  .weight-row {
    display: flex; align-items: center; gap: 10px;
    margin-top: 12px;
  }

  .weight-row .wbtn {
    width: 44px; height: 44px; flex: 0 0 44px;
    border-radius: 10px; border: 1.5px solid var(--line);
    background: var(--surface-2);
    font-size: 21px; font-weight: 700; line-height: 1;
  }

  .weight-row .wbtn:active { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

  .weight-val {
    font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums;
    min-width: 84px; text-align: center;
  }

  .weight-label { font-size: 12.5px; color: var(--faint); letter-spacing: .04em; }

  .note {
    margin: 10px 0 0; font-size: 13.5px; line-height: 1.5;
    border-radius: 8px; padding: 9px 11px;
    color: var(--amber); background: var(--amber-soft);
  }

  .note.swapped { color: #a9c2ff; background: var(--accent-soft); }

  .sets { display: flex; gap: 8px; margin: 13px 0 0; flex-wrap: wrap; }

  .set {
    width: var(--tap); height: var(--tap);
    border-radius: 10px; border: 1.5px solid var(--line);
    background: var(--surface-2);
    font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums;
  }

  .set[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

  .ex-actions { display: flex; gap: 8px; margin-top: 12px; }

  .btn-ghost {
    flex: 1; min-height: 44px;
    border-radius: 10px; border: 1.5px solid var(--line);
    background: transparent; color: var(--muted);
    font-size: 14.5px; font-weight: 600;
  }

  .btn-ghost:active, .btn-ghost:hover { border-color: var(--accent); color: var(--ink); }

  /* Bottom action (phones) */
  .bottom {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
    padding: 12px 18px calc(12px + env(safe-area-inset-bottom));
    background: linear-gradient(to top, var(--bg) 62%, rgba(14,17,22,0));
  }

  .bottom-inner { max-width: 560px; margin: 0 auto; }

  .btn-primary {
    width: 100%; min-height: 56px;
    border-radius: 14px; border: none;
    background: var(--accent); color: var(--accent-ink);
    font-size: 17px; font-weight: 700; letter-spacing: -0.01em;
  }

  .btn-primary:active { transform: translateY(1px); }
  .btn-primary.inline { min-height: 50px; margin-top: 22px; }

  /* Swap sheet */
  .scrim { position: fixed; inset: 0; background: rgba(0,0,0,.62); z-index: 40; }

  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
    background: var(--surface);
    border-radius: 20px 20px 0 0;
    border-top: 1px solid var(--line);
    max-height: 86vh; overflow-y: auto;
    padding: 8px 18px calc(24px + env(safe-area-inset-bottom));
    animation: rise .22s ease-out;
  }

  @media (min-width: 980px) {
    .sheet {
      left: 50%; bottom: auto; top: 50%;
      transform: translate(-50%, -50%);
      width: min(520px, 92vw);
      border-radius: 18px;
      border: 1px solid var(--line);
      max-height: 82vh;
      animation: pop .18s ease-out;
    }
    .sheet .handle { display: none; }
  }

  @keyframes rise { from { transform: translateY(24px); opacity: .4; } to { transform: none; opacity: 1; } }
  @keyframes pop { from { transform: translate(-50%, -48%); opacity: .5; } to { transform: translate(-50%, -50%); opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .sheet { animation: none; } }

  .handle { width: 40px; height: 4px; background: var(--line); border-radius: 2px; margin: 6px auto 16px; }

  .sheet h3 { font-size: 20px; font-weight: 800; margin: 0 0 4px; letter-spacing: -0.01em; }
  .sheet-sub { color: var(--muted); font-size: 14.5px; margin: 0 0 18px; }

  .opt {
    width: 100%; text-align: left;
    background: var(--surface-2);
    border: 1.5px solid var(--line);
    border-radius: 13px;
    padding: 14px 15px; margin-bottom: 10px;
    min-height: var(--tap);
  }

  .opt:active, .opt:hover { border-color: var(--accent); }

  .opt-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .opt-name { font-size: 16.5px; font-weight: 700; }

  .match {
    font-size: 10.5px; font-weight: 800; letter-spacing: .07em; text-transform: uppercase;
    padding: 4px 8px; border-radius: 5px; white-space: nowrap;
  }

  .match.close { background: var(--accent-soft); color: var(--accent); }
  .match.diff { background: var(--amber-soft); color: var(--amber); }

  .opt-trade { font-size: 14px; color: var(--muted); margin: 7px 0 0; line-height: 1.5; }
  .opt-equip { font-size: 12.5px; color: var(--faint); margin: 6px 0 0; }

  .opt.danger { border-style: dashed; }
  .opt.danger .opt-name { color: var(--alert); }

  .empty { color: var(--muted); font-size: 15px; padding: 8px 0 18px; line-height: 1.55; }

  .done-card {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 14px; padding: 20px; text-align: center;
  }

  .done-card .big { font-size: 40px; font-weight: 800; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .done-card p { color: var(--muted); font-size: 14.5px; margin: 6px 0 0; }

  .foot-note { color: var(--faint); font-size: 12.5px; line-height: 1.55; margin: 22px 0 8px; }

  button:focus-visible, .opt:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body data-view="setup">

<div class="topbar">
  <div class="topbar-inner">
    <div class="wordmark">Rack<span>.</span></div>
    <button class="context-chip" id="contextChip" hidden>
      <span id="contextText"></span>
      <span aria-hidden="true">Edit ›</span>
    </button>
  </div>
</div>

<div class="shell">
  <aside class="pane-setup" id="paneSetup"></aside>
  <section class="pane-session" id="paneSession"></section>
</div>

<div class="bottom">
  <div class="bottom-inner">
    <button class="btn-primary" id="primaryBtn">Build my session</button>
  </div>
</div>

<div id="sheetHost"></div>

<script>
/* ---------------------------------------------------------------
   Exercise library.
   loadCeiling  1-3  how heavy you can realistically load it
   stability    1-3  how much stabiliser and core demand it carries
   --------------------------------------------------------------- */
const EX = [
  { id:'back-squat',   name:'Back Squat',             pattern:'squat', muscle:'quads',      equip:['barbell','rack'],   loadCeiling:3, stability:3, unilateral:false, w:185 },
  { id:'front-squat',  name:'Front Squat',            pattern:'squat', muscle:'quads',      equip:['barbell','rack'],   loadCeiling:3, stability:3, unilateral:false, w:135 },
  { id:'goblet-squat', name:'Goblet Squat',           pattern:'squat', muscle:'quads',      equip:['dumbbell'],         loadCeiling:1, stability:2, unilateral:false, w:50 },
  { id:'leg-press',    name:'Leg Press',              pattern:'squat', muscle:'quads',      equip:['machine'],          loadCeiling:3, stability:1, unilateral:false, w:270 },
  { id:'split-squat',  name:'Bulgarian Split Squat',  pattern:'lunge', muscle:'quads',      equip:['dumbbell','bench'], loadCeiling:2, stability:3, unilateral:true,  w:40 },
  { id:'walking-lunge',name:'Walking Lunge',          pattern:'lunge', muscle:'quads',      equip:['dumbbell'],         loadCeiling:2, stability:3, unilateral:true,  w:35 },
  { id:'step-up',      name:'Step-Up',                pattern:'lunge', muscle:'quads',      equip:['dumbbell','bench'], loadCeiling:2, stability:3, unilateral:true,  w:35 },

  { id:'deadlift',     name:'Deadlift',               pattern:'hinge', muscle:'hamstrings', equip:['barbell'],          loadCeiling:3, stability:3, unilateral:false, w:275 },
  { id:'rdl',          name:'Romanian Deadlift',      pattern:'hinge', muscle:'hamstrings', equip:['barbell'],          loadCeiling:3, stability:2, unilateral:false, w:135 },
  { id:'db-rdl',       name:'Dumbbell RDL',           pattern:'hinge', muscle:'hamstrings', equip:['dumbbell'],         loadCeiling:2, stability:2, unilateral:false, w:50 },
  { id:'kb-swing',     name:'Kettlebell Swing',       pattern:'hinge', muscle:'hamstrings', equip:['kettlebell'],       loadCeiling:2, stability:2, unilateral:false, w:53 },
  { id:'back-ext',     name:'Back Extension',         pattern:'hinge', muscle:'hamstrings', equip:['machine'],          loadCeiling:1, stability:2, unilateral:false, w:0  },
  { id:'leg-curl',     name:'Leg Curl',               pattern:'hinge', muscle:'hamstrings', equip:['machine'],          loadCeiling:2, stability:1, unilateral:false, w:70 },
  { id:'slider-curl',  name:'Sliding Leg Curl',       pattern:'hinge', muscle:'hamstrings', equip:['bodyweight'],       loadCeiling:1, stability:2, unilateral:false, w:0  },

  { id:'bench',        name:'Bench Press',            pattern:'pushH', muscle:'chest',      equip:['barbell','bench'],  loadCeiling:3, stability:2, unilateral:false, w:135 },
  { id:'db-bench',     name:'Dumbbell Bench Press',   pattern:'pushH', muscle:'chest',      equip:['dumbbell','bench'], loadCeiling:2, stability:3, unilateral:false, w:55 },
  { id:'machine-press',name:'Chest Press Machine',    pattern:'pushH', muscle:'chest',      equip:['machine'],          loadCeiling:3, stability:1, unilateral:false, w:120 },
  { id:'pushup',       name:'Push-Up',                pattern:'pushH', muscle:'chest',      equip:['bodyweight'],       loadCeiling:1, stability:3, unilateral:false, w:0  },
  { id:'cable-fly',    name:'Cable Fly',              pattern:'pushH', muscle:'chest',      equip:['cables'],           loadCeiling:2, stability:1, unilateral:false, w:30 },
  { id:'db-fly',       name:'Dumbbell Fly',           pattern:'pushH', muscle:'chest',      equip:['dumbbell','bench'], loadCeiling:1, stability:2, unilateral:false, w:25 },

  { id:'ohp',          name:'Overhead Press',         pattern:'pushV', muscle:'shoulders',  equip:['barbell'],          loadCeiling:3, stability:3, unilateral:false, w:95  },
  { id:'db-ohp',       name:'Dumbbell Shoulder Press',pattern:'pushV', muscle:'shoulders',  equip:['dumbbell'],         loadCeiling:2, stability:3, unilateral:false, w:40  },
  { id:'machine-ohp',  name:'Shoulder Press Machine', pattern:'pushV', muscle:'shoulders',  equip:['machine'],          loadCeiling:2, stability:1, unilateral:false, w:90  },
  { id:'pike-pushup',  name:'Pike Push-Up',           pattern:'pushV', muscle:'shoulders',  equip:['bodyweight'],       loadCeiling:1, stability:3, unilateral:false, w:0   },
  { id:'lat-raise',    name:'Lateral Raise',          pattern:'pushV', muscle:'shoulders',  equip:['dumbbell'],         loadCeiling:1, stability:1, unilateral:false, w:15  },

  { id:'bb-row',       name:'Barbell Row',            pattern:'pullH', muscle:'back',       equip:['barbell'],          loadCeiling:3, stability:3, unilateral:false, w:135 },
  { id:'db-row',       name:'Dumbbell Row',           pattern:'pullH', muscle:'back',       equip:['dumbbell','bench'], loadCeiling:2, stability:2, unilateral:true,  w:60  },
  { id:'cable-row',    name:'Seated Cable Row',       pattern:'pullH', muscle:'back',       equip:['cables'],           loadCeiling:3, stability:1, unilateral:false, w:120 },
  { id:'inv-row',      name:'Inverted Row',           pattern:'pullH', muscle:'back',       equip:['bodyweight'],       loadCeiling:1, stability:3, unilateral:false, w:0   },
  { id:'band-row',     name:'Band Row',               pattern:'pullH', muscle:'back',       equip:['bands'],            loadCeiling:1, stability:1, unilateral:false, w:0   },

  { id:'pullup',       name:'Pull-Up',                pattern:'pullV', muscle:'lats',       equip:['pullupbar'],        loadCeiling:2, stability:3, unilateral:false, w:0   },
  { id:'lat-pulldown', name:'Lat Pulldown',           pattern:'pullV', muscle:'lats',       equip:['cables'],           loadCeiling:2, stability:1, unilateral:false, w:110 },
  { id:'band-pulldown',name:'Band Pulldown',          pattern:'pullV', muscle:'lats',       equip:['bands'],            loadCeiling:1, stability:1, unilateral:false, w:0   },

  { id:'plank',        name:'Plank',                  pattern:'core',  muscle:'core',       equip:['bodyweight'],       loadCeiling:1, stability:3, unilateral:false, w:0  },
  { id:'deadbug',      name:'Dead Bug',               pattern:'core',  muscle:'core',       equip:['bodyweight'],       loadCeiling:1, stability:2, unilateral:false, w:0  },
  { id:'cable-crunch', name:'Cable Crunch',           pattern:'core',  muscle:'core',       equip:['cables'],           loadCeiling:2, stability:1, unilateral:false, w:60 }
];

const byId = id => EX.find(e => e.id === id);

/* Priority 1 = main lift (protected from cuts), 3 = accessory (cut first) */
const DAYS = {
  lowerA: { name:'Lower A', focus:'Squat', items:[
    { ex:'back-squat',   sets:4, reps:5,  priority:1 },
    { ex:'rdl',          sets:3, reps:8,  priority:2 },
    { ex:'split-squat',  sets:3, reps:10, priority:2 },
    { ex:'leg-curl',     sets:3, reps:12, priority:3 },
    { ex:'plank',        sets:3, reps:45, priority:3, isTime:true }
  ]},
  upperA: { name:'Upper A', focus:'Bench', items:[
    { ex:'bench',        sets:4, reps:5,  priority:1 },
    { ex:'bb-row',       sets:4, reps:8,  priority:2 },
    { ex:'db-ohp',       sets:3, reps:8,  priority:2 },
    { ex:'lat-pulldown', sets:3, reps:10, priority:3 },
    { ex:'cable-fly',    sets:3, reps:12, priority:3 }
  ]},
  lowerB: { name:'Lower B', focus:'Deadlift', items:[
    { ex:'deadlift',     sets:4, reps:3,  priority:1 },
    { ex:'front-squat',  sets:3, reps:8,  priority:2 },
    { ex:'walking-lunge',sets:3, reps:12, priority:2 },
    { ex:'back-ext',     sets:3, reps:12, priority:3 },
    { ex:'deadbug',      sets:3, reps:30, priority:3, isTime:true }
  ]},
  upperB: { name:'Upper B', focus:'Overhead', items:[
    { ex:'ohp',          sets:4, reps:5,  priority:1 },
    { ex:'pullup',       sets:4, reps:6,  priority:2 },
    { ex:'db-bench',     sets:3, reps:10, priority:2 },
    { ex:'cable-row',    sets:3, reps:12, priority:3 },
    { ex:'lat-raise',    sets:3, reps:15, priority:3 }
  ]}
};

const EQUIPMENT = [
  { id:'barbell',    label:'Barbell' },
  { id:'rack',       label:'Squat rack' },
  { id:'dumbbell',   label:'Dumbbells' },
  { id:'bench',      label:'Bench' },
  { id:'machine',    label:'Machines' },
  { id:'cables',     label:'Cables' },
  { id:'pullupbar',  label:'Pull-up bar' },
  { id:'kettlebell', label:'Kettlebells' },
  { id:'bands',      label:'Bands' }
];

const PRESETS = {
  full:   { label:'Full gym',       equip:['barbell','rack','dumbbell','bench','machine','cables','pullupbar','kettlebell','bands'], dbMax:100 },
  hotel:  { label:'Hotel gym',      equip:['dumbbell','bench','machine'], dbMax:50 },
  dbonly: { label:'Dumbbells only', equip:['dumbbell'], dbMax:30 },
  home:   { label:'Home rack',      equip:['barbell','rack','bench','pullupbar','bands'], dbMax:0 }
};

/* Movement restrictions. These remove patterns outright rather than quietly
   routing around them, and the session says what was removed and why. */
const RESTRICTIONS = [
  { id:'back',     label:'Lower back', patterns:['hinge'],           exercises:['bb-row'],            says:'hinging and loaded rounding' },
  { id:'knee',     label:'Knee',       patterns:['squat','lunge'],   exercises:[],                    says:'deep knee bending' },
  { id:'shoulder', label:'Shoulder',   patterns:['pushV'],           exercises:['bench','db-bench'],  says:'overhead and flat pressing' },
  { id:'wrist',    label:'Elbow / wrist', patterns:[],               exercises:['pushup','bench','ohp','pike-pushup'], says:'loading through the wrist' }
];

const defaults = {
  view: 'setup',
  day: 'lowerA',
  preset: 'full',
  equip: [...PRESETS.full.equip],
  dbMax: 50,
  minutes: 60,
  avoid: [],          // restriction ids
  avoidEx: [],        // specific exercises the user marked as off limits
  weights: {},        // exercise id -> working weight
  logged: {},         // exercise id -> [bool]
  session: null,
  finished: false
};

let state = Object.assign({}, defaults, load() || {});

function save() { try { localStorage.setItem('rack.v2', JSON.stringify(state)); } catch (e) {} }
function load() { try { return JSON.parse(localStorage.getItem('rack.v2')); } catch (e) { return null; } }

const has = id => id === 'bodyweight' || state.equip.includes(id);
const canDo = ex => ex.equip.every(has);
const activeRestrictions = () => RESTRICTIONS.filter(r => state.avoid.includes(r.id));

function restrictionFor(ex) {
  if (state.avoidEx.includes(ex.id)) return { label: 'your own note', says: 'this movement' };
  return activeRestrictions().find(r => r.patterns.includes(ex.pattern) || r.exercises.includes(ex.id)) || null;
}

const usable = ex => canDo(ex) && !restrictionFor(ex);
const weightOf = id => state.weights[id] !== undefined ? state.weights[id] : byId(id).w;

/* --- Substitution ranking (REQ-B2) ------------------------------- */
function score(original, cand) {
  let s = 0;
  if (cand.pattern === original.pattern) s += 3;
  if (cand.muscle === original.muscle) s += 2;
  s += 2 - Math.abs(cand.loadCeiling - original.loadCeiling);
  s += 1 - Math.abs(cand.stability - original.stability) * 0.5;
  return s;
}

/* --- Honest tradeoff copy (REQ-B3) ------------------------------- */
function tradeoff(original, cand) {
  const bits = [];
  if (cand.loadCeiling < original.loadCeiling) bits.push('harder to load heavy');
  if (cand.loadCeiling > original.loadCeiling) bits.push('easier to load heavy');
  if (cand.stability < original.stability) bits.push('less stabiliser and core demand');
  if (cand.stability > original.stability) bits.push('more stabiliser demand');
  if (cand.unilateral && !original.unilateral) bits.push('one side at a time, so it takes longer');
  if (!cand.unilateral && original.unilateral) bits.push('both sides at once, so it is quicker');
  if (cand.pattern !== original.pattern) bits.unshift('different movement pattern');
  if (!bits.length) return 'Same pattern, same muscle, same loading. Straight swap.';
  return bits.join(', ').replace(/^./, c => c.toUpperCase()) + '.';
}

function alternatives(originalId, exclude = []) {
  const original = byId(originalId);
  return EX
    .filter(e => e.id !== original.id && !exclude.includes(e.id) && usable(e))
    .filter(e => e.pattern === original.pattern || e.muscle === original.muscle)
    .map(e => ({ ex:e, s:score(original, e) }))
    .sort((a, b) => b.s - a.s)
    .slice(0, 5);
}

/* --- Build the session ------------------------------------------- */
const estimate = items => items.reduce((m, it) => m + it.sets * 2.5, 0) + 8;

function buildSession() {
  let items = DAYS[state.day].items.map(it => ({ ...it }));
  const cut = [], notes = [];
  const removedByLimit = [], removedByKit = [];
  let mainLiftGone = null;

  items.forEach(it => {
    const original = byId(it.ex);
    const blockedBy = restrictionFor(original);
    const missingKit = !canDo(original);
    if (!blockedBy && !missingKit) return;

    const taken = items.filter(o => o !== it).map(o => o.ex);
    const alt = alternatives(it.ex, taken)[0];
    if (alt) {
      it.swappedFrom = it.ex;
      it.ex = alt.ex.id;
      it.reason = blockedBy
        ? `Swapped from ${original.name}: you're working around ${blockedBy.label.toLowerCase()}. ${tradeoff(original, alt.ex)}`
        : `Swapped from ${original.name}, which needs kit you don't have. ${tradeoff(original, alt.ex)}`;
      it.viaRestriction = !!blockedBy;
    } else {
      it.drop = true;
      (blockedBy ? removedByLimit : removedByKit).push(original.name);
      if (it.priority === 1) mainLiftGone = { name: original.name, byLimit: !!blockedBy };
    }
  });

  items = items.filter(it => !it.drop);

  // Load available, not load ideal (REQ-B4)
  items.forEach(it => {
    const ex = byId(it.ex);
    const w = weightOf(ex.id);
    if (ex.equip.includes('dumbbell') && state.dbMax && w > state.dbMax && !it.isTime) {
      it.reps = Math.min(20, it.reps + 5);
      it.loadNote = `Dumbbells here top out at ${state.dbMax} lb, so reps go to ${it.reps} to stay in range.`;
      it.capped = true;
    }
  });

  // Compress by priority, main lift protected (REQ-B5)
  while (estimate(items) > state.minutes && items.some(i => i.priority === 3)) {
    const idx = items.map(i => i.priority).lastIndexOf(3);
    cut.push(byId(items[idx].ex).name);
    items.splice(idx, 1);
  }
  while (estimate(items) > state.minutes && items.some(i => i.priority === 2 && i.sets > 2)) {
    const it = items.filter(i => i.priority === 2 && i.sets > 2).sort((a, b) => b.sets - a.sets)[0];
    it.sets -= 1;
    it.setNote = 'Trimmed a set to fit the time.';
  }

  const restr = activeRestrictions();
  if (restr.length || state.avoidEx.length) {
    const swapped = items.filter(i => i.viaRestriction).map(i => byId(i.swappedFrom).name);
    const labels = restr.map(r => r.label.toLowerCase());
    if (state.avoidEx.length) labels.push('movements you marked off limits');
    let msg = `Working around <b>${labels.join(' and ')}</b>. `;
    if (swapped.length) msg += `Replaced ${swapped.join(', ')}. `;
    if (removedByLimit.length) msg += `Nothing trains ${removedByLimit.join(' or ')} without that pattern, so it's out today. `;
    msg += `<span class="disclaim">Rack takes out the movement patterns you tell it to. It doesn't diagnose anything and it isn't medical advice.</span>`;
    notes.push({ kind:'safety', msg });
  }

  if (removedByKit.length) {
    notes.push({ kind:'safety', msg:`No option for <b>${removedByKit.join(', ')}</b> with this equipment, so it's left out.` });
  }

  // The day's premise is gone. Say so, and offer a day that still works.
  if (mainLiftGone) {
    const better = Object.entries(DAYS).find(([k, d]) => {
      if (k === state.day) return false;
      const main = byId(d.items.find(i => i.priority === 1).ex);
      return usable(main);
    });
    let msg = `<b>${DAYS[state.day].name} is built around the ${mainLiftGone.name}</b>, and that's out today, so what's left is accessory work. `;
    if (better) msg += `${better[1].name} still works with these limits. <button class="btn-ghost" data-day="${better[0]}" style="margin-top:10px">Switch to ${better[1].name}</button>`;
    notes.unshift({ kind:'safety', msg });
  }

  if (cut.length) notes.push({ kind:'time', msg:`Cut to fit ${state.minutes} minutes: <b>${cut.join(', ')}</b>. Your main lift is untouched.` });

  state.session = { items, notes, day: state.day };
  state.finished = false;
  save();
}

/* --- Rendering ---------------------------------------------------- */
const paneSetup = document.getElementById('paneSetup');
const paneSession = document.getElementById('paneSession');
const primaryBtn = document.getElementById('primaryBtn');
const contextChip = document.getElementById('contextChip');
const contextText = document.getElementById('contextText');
const sheetHost = document.getElementById('sheetHost');

function presetLabel() {
  const p = Object.values(PRESETS).find(p => p.equip.length === state.equip.length && p.equip.every(e => state.equip.includes(e)));
  return p ? p.label : `${state.equip.length} items`;
}

function render() {
  document.body.dataset.view = state.view;
  contextChip.hidden = state.view !== 'session';
  contextText.textContent = `${DAYS[state.day].name} / ${presetLabel()} / ${state.minutes} min`;
  renderSetup();
  renderSession();
  primaryBtn.textContent =
    state.view === 'setup' ? 'Build my session'
    : state.finished ? 'Set up next session'
    : 'Finish session';
  save();
}

function renderSetup() {
  paneSetup.innerHTML = `
    <p class="step-label">Set up</p>
    <h1>What's the situation?</h1>
    <p class="sub">Rack builds today's session around what's actually available.</p>

    <h2>Day</h2>
    <div class="chip-row">
      ${Object.entries(DAYS).map(([k, d]) => `
        <button class="chip ${state.day === k ? 'on' : ''}" data-day="${k}">${d.name}</button>
      `).join('')}
    </div>

    <h2>Start from</h2>
    <div class="chip-row">
      ${Object.entries(PRESETS).map(([k, p]) => `
        <button class="chip ${state.preset === k ? 'on' : ''}" data-preset="${k}">${p.label}</button>
      `).join('')}
    </div>

    <h2>What's available</h2>
    <div class="grid-2">
      ${EQUIPMENT.map(e => `
        <button class="chip" data-equip="${e.id}" aria-pressed="${has(e.id)}">
          <span class="tick" aria-hidden="true">✓</span>${e.label}
        </button>
      `).join('')}
    </div>

    ${has('dumbbell') ? `
      <h2>Heaviest dumbbell</h2>
      <div class="stepper">
        <button data-db="-5" aria-label="Lighter">−</button>
        <div class="val">${state.dbMax}<small>POUNDS</small></div>
        <button data-db="5" aria-label="Heavier">+</button>
      </div>` : ''}

    <h2>Time you've got</h2>
    <div class="chip-row">
      ${[30, 45, 60, 75].map(m => `
        <button class="chip ${state.minutes === m ? 'on' : ''}" data-min="${m}">${m} min</button>
      `).join('')}
    </div>

    <h2>Working around anything?</h2>
    <div class="grid-2">
      ${RESTRICTIONS.map(r => `
        <button class="chip warn" data-avoid="${r.id}" aria-pressed="${state.avoid.includes(r.id)}">
          <span class="tick" aria-hidden="true">✓</span>${r.label}
        </button>
      `).join('')}
    </div>
    ${state.avoidEx.length ? `
      <p class="foot-note">Also avoiding: ${state.avoidEx.map(id => byId(id).name).join(', ')}.
      <button class="btn-ghost" data-clear-avoid="1" style="margin-top:8px">Clear these</button></p>` : ''}

    <button class="btn-primary inline desktop-only" data-rebuild="1">Rebuild session</button>

    <p class="foot-note">Prototype. Everything runs locally and works with no signal, which is the point: gym basements don't have any.</p>
  `;
}

function renderSession() {
  if (!state.session) { paneSession.innerHTML = ''; return; }
  const s = state.session;
  const totalSets = s.items.reduce((m, i) => m + i.sets, 0);
  const doneSets = s.items.reduce((m, i) => m + ((state.logged[i.ex] || []).filter(Boolean).length), 0);
  const finished = state.finished || (totalSets > 0 && doneSets >= totalSets);

  paneSession.innerHTML = `
    <p class="step-label">${DAYS[s.day].name} / ${DAYS[s.day].focus} focus</p>
    <h1>${Math.round(estimate(s.items))} min, ${s.items.length} exercises</h1>
    <p class="sub">${doneSets} of ${totalSets} sets logged.</p>

    ${s.notes.map(n => `<div class="banner ${n.kind}">${n.msg}</div>`).join('')}

    ${s.items.map(it => {
      const ex = byId(it.ex);
      const log = state.logged[ex.id] || [];
      const allDone = log.filter(Boolean).length >= it.sets;
      const w = weightOf(ex.id);
      const shown = it.capped ? Math.min(w, state.dbMax) : w;
      return `
        <div class="ex ${allDone ? 'done' : ''}">
          <div class="ex-top">
            <div>
              <p class="ex-name">${ex.name}</p>
              <p class="ex-meta">${it.sets} × ${it.isTime ? it.reps + 's' : it.reps}</p>
            </div>
            <span class="pill ${it.priority === 1 ? 'main' : ''}">${it.priority === 1 ? 'Main lift' : ex.pattern}</span>
          </div>

          ${it.reason ? `<p class="note swapped">${it.reason}</p>` : ''}
          ${it.loadNote ? `<p class="note">${it.loadNote}</p>` : ''}
          ${it.setNote ? `<p class="note">${it.setNote}</p>` : ''}

          ${ex.w === 0 ? `<p class="ex-meta" style="margin-top:12px">Bodyweight</p>` : `
            <div class="weight-row">
              <button class="wbtn" data-w="${ex.id}:-5" aria-label="Lighter">−</button>
              <div class="weight-val">${shown} lb</div>
              <button class="wbtn" data-w="${ex.id}:5" aria-label="Heavier">+</button>
              <span class="weight-label">working weight</span>
            </div>`}

          <div class="sets">
            ${Array.from({ length: it.sets }, (_, k) => `
              <button class="set" data-log="${ex.id}:${k}" aria-pressed="${!!log[k]}" aria-label="Set ${k+1}">${k+1}</button>
            `).join('')}
          </div>

          <div class="ex-actions">
            <button class="btn-ghost" data-swap="${ex.id}">Swap exercise</button>
          </div>
        </div>`;
    }).join('')}

    ${finished ? `
      <div class="done-card">
        <div class="big">${doneSets}</div>
        <p>sets done. Next week Rack returns to the programmed lift if it's free, and keeps progressing whatever you actually did if it isn't.</p>
      </div>` : ''}

    <p class="foot-note">Prototype: substitution ranking, load adjustment, restriction handling and time compression are real logic, not mocked screens.</p>
  `;
}

/* --- Swap sheet ---------------------------------------------------- */
function openSheet(exId) {
  const it = state.session.items.find(i => i.ex === exId);
  const original = byId(exId);
  const taken = state.session.items.filter(o => o !== it).map(o => o.ex);
  const opts = alternatives(exId, taken);

  sheetHost.innerHTML = `
    <div class="scrim" data-close="1"></div>
    <div class="sheet" role="dialog" aria-modal="true" aria-label="Swap ${original.name}">
      <div class="handle"></div>
      <h3>Swap ${original.name}</h3>
      <p class="sheet-sub">Ranked on movement pattern, muscle and how heavy you can load it. What changes is spelled out.</p>
      ${opts.length ? opts.map(o => `
        <button class="opt" data-pick="${exId}:${o.ex.id}">
          <div class="opt-top">
            <span class="opt-name">${o.ex.name}</span>
            <span class="match ${o.s >= 5 ? 'close' : 'diff'}">${o.s >= 5 ? 'Close match' : 'Different stimulus'}</span>
          </div>
          <p class="opt-trade">${tradeoff(original, o.ex)}</p>
          <p class="opt-equip">Needs: ${o.ex.equip.join(', ')}</p>
        </button>
      `).join('') : `<p class="empty">Nothing here trains this pattern with the equipment you've got and the limits you've set. Keep it and wait for the rack, or change what's available.</p>`}
      <button class="opt danger" data-cant="${exId}">
        <div class="opt-top"><span class="opt-name">I can't do this movement</span></div>
        <p class="opt-trade">Takes ${original.name} out of every session until you clear it, and keeps it out of substitution options.</p>
      </button>
    </div>
  `;
  document.body.style.overflow = 'hidden';
}

function closeSheet() {
  sheetHost.innerHTML = '';
  document.body.style.overflow = '';
}

/* --- Events -------------------------------------------------------- */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-day],[data-preset],[data-equip],[data-min],[data-db],[data-avoid],[data-clear-avoid],[data-w],[data-log],[data-swap],[data-pick],[data-cant],[data-close],[data-rebuild]');
  if (!t) return;
  const d = t.dataset;

  if (d.day) { state.day = d.day; buildSession(); render(); return; }

  if (d.preset) {
    const p = PRESETS[d.preset];
    state.preset = d.preset;
    state.equip = [...p.equip];
    if (p.dbMax) state.dbMax = p.dbMax;
    buildSession(); render(); return;
  }

  if (d.equip) {
    state.equip = has(d.equip) ? state.equip.filter(x => x !== d.equip) : [...state.equip, d.equip];
    state.preset = null;
    buildSession(); render(); return;
  }

  if (d.min) { state.minutes = +d.min; buildSession(); render(); return; }

  if (d.db) {
    state.dbMax = Math.max(0, Math.min(150, state.dbMax + (+d.db)));
    buildSession(); render(); return;
  }

  if (d.avoid) {
    state.avoid = state.avoid.includes(d.avoid) ? state.avoid.filter(x => x !== d.avoid) : [...state.avoid, d.avoid];
    buildSession(); render(); return;
  }

  if (d.clearAvoid) { state.avoidEx = []; buildSession(); render(); return; }

  if (d.w) {
    const [id, delta] = d.w.split(':');
    state.weights[id] = Math.max(0, weightOf(id) + (+delta));
    buildSession(); render(); return;
  }

  if (d.log) {
    const [id, k] = d.log.split(':');
    const arr = state.logged[id] || (state.logged[id] = []);
    arr[+k] = !arr[+k];
    render(); return;
  }

  if (d.swap) { openSheet(d.swap); return; }

  if (d.pick) {
    const [fromId, toId] = d.pick.split(':');
    const it = state.session.items.find(i => i.ex === fromId);
    const from = byId(fromId), to = byId(toId);
    it.ex = toId;
    it.swappedFrom = fromId;
    it.viaRestriction = false;
    it.reason = `Swapped from ${from.name}. ${tradeoff(from, to)}`;
    closeSheet(); save(); render(); return;
  }

  if (d.cant) {
    if (!state.avoidEx.includes(d.cant)) state.avoidEx.push(d.cant);
    closeSheet(); buildSession(); render(); return;
  }

  if (d.close) { closeSheet(); return; }
  if (d.rebuild) { buildSession(); render(); return; }
});

primaryBtn.addEventListener('click', () => {
  if (state.view === 'setup') {
    buildSession();
    state.view = 'session';
    window.scrollTo(0, 0);
  } else if (!state.finished) {
    state.finished = true;
  } else {
    state.view = 'setup';
    window.scrollTo(0, 0);
  }
  render();
});

contextChip.addEventListener('click', () => { state.view = 'setup'; window.scrollTo(0, 0); render(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });

if (!state.session) buildSession();
render();
</script>

</body>
</html>
